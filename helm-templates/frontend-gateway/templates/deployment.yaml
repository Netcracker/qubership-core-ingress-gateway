---
kind: Deployment
apiVersion: apps/v1
metadata:
    name: '{{ .Values.INTERNAL_SERVICE }}'
    labels:
        name: '{{ .Values.INTERNAL_SERVICE }}'
        app.kubernetes.io/name: '{{ .Values.INTERNAL_SERVICE }}'
        app.kubernetes.io/instance: '{{ cat .Values.INTERNAL_SERVICE "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
        app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
        app.kubernetes.io/component: 'mesh-gateway'
        app.kubernetes.io/part-of: 'Cloud-Core'
        app.kubernetes.io/managed-by: 'saasDeployer'
        app.kubernetes.io/technology: 'cpp'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    annotations:
        netcracker.cloud/start.stage: '1'
spec:
    replicas: {{ .Values.REPLICAS | default 1 }}
    strategy:
    {{- if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "recreate" }}
      type: Recreate
    {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "best_effort_controlled_rollout" }}
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 80%
    {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "ramped_slow_rollout" }}
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    {{- else if eq (default "" .Values.DEPLOYMENT_STRATEGY_TYPE) "custom_rollout" }}
      type: RollingUpdate
      rollingUpdate:
        maxSurge: {{ .Values.DEPLOYMENT_STRATEGY_MAXSURGE | default "25%" }}
        maxUnavailable: {{ .Values.DEPLOYMENT_STRATEGY_MAXUNAVAILABLE | default "25%" }}
    {{- else }}
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
    {{- end }}
    template:
        metadata:
            labels:
                name: '{{ .Values.INTERNAL_SERVICE }}'
                app.kubernetes.io/name: '{{ .Values.INTERNAL_SERVICE }}'
                app.kubernetes.io/instance: '{{ cat .Values.INTERNAL_SERVICE "-" .Values.NAMESPACE | nospace | trunc 63 | trimSuffix "-" }}'
                app.kubernetes.io/version: '{{ .Values.ARTIFACT_DESCRIPTOR_VERSION }}'
                app.kubernetes.io/component: 'mesh-gateway'
                app.kubernetes.io/part-of: 'Cloud-Core'
                app.kubernetes.io/managed-by: 'saasDeployer'
                app.kubernetes.io/technology: 'cpp'
        spec:
            volumes:
{{ if and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
            -   name: config
                emptyDir: {}
{{ end }}
            containers:
            -   name: '{{ .Values.INTERNAL_SERVICE }}'
                image: '{{ .Values.IMAGE_REPOSITORY }}:{{ .Values.TAG }}'
                volumeMounts:
{{ if and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
                -   name: config
                    mountPath: /envoy/config
{{ end }}
                args:
                - /envoy/run.sh
                ports:
                -   name: web
                    containerPort: 8080
                    protocol: TCP
                -   name: admin
                    containerPort: 9901
                    protocol: TCP
                env:
                -   name: SERVICE_NAME_VARIABLE
                    value: '{{ .Values.INTERNAL_SERVICE_NAME }}'
                -   name: LOG_LEVEL
                    value: '{{ lower .Values.LOG_LEVEL }}'
                -   name: CLOUD_NAMESPACE
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.namespace
                -   name: POD_HOSTNAME
                    valueFrom:
                        fieldRef:
                            fieldPath: metadata.name
                -   name: IP_STACK
                    value: '{{ .Values.IP_STACK }}'
                -   name: IP_BIND
                    value: '{{ if eq .Values.IP_STACK "v6" }} "::" {{ else }} "0.0.0.0" {{ end }}'
                -   name: TRACING_ENABLED
                    value: '{{ .Values.TRACING_ENABLED }}'
                -   name: TRACING_HOST
                    value: '{{ .Values.TRACING_HOST }}'
                -   name: ENVOY_UID
                    value: '{{ .Values.ENVOY_UID }}'
                -   name: XDS_CLUSTER_HOST
                    value: '{{ .Values.XDS_CLUSTER_HOST }}'
                -   name: XDS_CLUSTER_PORT
                    value: '{{ .Values.XDS_CLUSTER_PORT }}'
                -   name: RUN_COREDNS
                    value: '{{ .Values.RUN_COREDNS }}'
                -   name: FACADE_GATEWAY
                    value: '{{ .Values.FACADE_GATEWAY }}'
                resources:
                    requests:
                        cpu: '{{ .Values.CPU_REQUEST }}'
                        memory: '{{ .Values.INTERNAL_GW_MEMORY_REQUEST }}'
                    limits:
                        memory: '{{ .Values.INTERNAL_GW_MEMORY_LIMIT }}'
                        cpu: {{ .Values.INTERNAL_GW_CPU_LIMIT }}
                livenessProbe:
                  httpGet:
                    path: '{{ .Values.HEALTHCHECK_PATH }}'
                    port: '{{ .Values.HEALTHCHECK_PORT }}'
                    scheme: 'HTTP'
                  initialDelaySeconds: {{ ternary 10 .Values.PROBE_LIVENESS_INITIAL_DELAY_SECONDS (lt (int .Values.PROBE_LIVENESS_INITIAL_DELAY_SECONDS) 0) }}
                  timeoutSeconds: {{ ternary 10 .Values.PROBE_LIVENESS_TIMEOUT_SECONDS (lt (int .Values.PROBE_LIVENESS_TIMEOUT_SECONDS) 0) }}
                  periodSeconds: {{ ternary 5 .Values.PROBE_LIVENESS_PERIOD_SECONDS (lt (int .Values.PROBE_LIVENESS_PERIOD_SECONDS) 0) }}
                  successThreshold: {{ ternary 1 .Values.PROBE_LIVENESS_SUCCESS_THRESHOLD (lt (int .Values.PROBE_LIVENESS_SUCCESS_THRESHOLD) 0) }}
                  failureThreshold: {{ ternary 3 .Values.PROBE_LIVENESS_FAILURE_THRESHOLD (lt (int .Values.PROBE_LIVENESS_FAILURE_THRESHOLD) 0) }}
                readinessProbe:
                  httpGet:
                    path: '{{ .Values.READINESS_PATH }}'
                    port: '{{ .Values.HEALTHCHECK_PORT }}'
                    scheme: 'HTTP'
                  initialDelaySeconds: {{ ternary 1 .Values.PROBE_READINESS_INITIAL_DELAY_SECONDS (lt (int .Values.PROBE_READINESS_INITIAL_DELAY_SECONDS) 0) }}
                  timeoutSeconds: {{ ternary 10 .Values.PROBE_READINESS_TIMEOUT_SECONDS (lt (int .Values.PROBE_READINESS_TIMEOUT_SECONDS) 0) }}
                  periodSeconds: {{ ternary 2 .Values.PROBE_READINESS_PERIOD_SECONDS (lt (int .Values.PROBE_READINESS_PERIOD_SECONDS) 0) }}
                  successThreshold: {{ ternary 1 .Values.PROBE_READINESS_SUCCESS_THRESHOLD (lt (int .Values.PROBE_READINESS_SUCCESS_THRESHOLD) 0) }}
                  failureThreshold: {{ ternary 15 .Values.PROBE_READINESS_FAILURE_THRESHOLD (lt (int .Values.PROBE_READINESS_FAILURE_THRESHOLD) 0) }}
                startupProbe:
                  httpGet:
                    path: '{{ .Values.HEALTHCHECK_PATH }}'
                    port: '{{ .Values.HEALTHCHECK_PORT }}'
                    scheme: 'HTTP'
                  initialDelaySeconds: {{ ternary 3 .Values.PROBE_STARTUP_INITIAL_DELAY_SECONDS (lt (int .Values.PROBE_STARTUP_INITIAL_DELAY_SECONDS) 0) }}
                  timeoutSeconds: {{ ternary 1 .Values.PROBE_STARTUP_TIMEOUT_SECONDS (lt (int .Values.PROBE_STARTUP_TIMEOUT_SECONDS) 0) }}
                  periodSeconds: {{ ternary 2 .Values.PROBE_STARTUP_PERIOD_SECONDS (lt (int .Values.PROBE_STARTUP_PERIOD_SECONDS) 0) }}
                  successThreshold: {{ ternary 1 .Values.PROBE_STARTUP_SUCCESS_THRESHOLD (lt (int .Values.PROBE_STARTUP_SUCCESS_THRESHOLD) 0) }}
                  failureThreshold: {{ ternary 40 .Values.PROBE_STARTUP_FAILURE_THRESHOLD (lt (int .Values.PROBE_READINESS_FAILURE_THRESHOLD) 0) }}

                securityContext:
{{ if eq .Values.PAAS_PLATFORM "KUBERNETES" }}
                    runAsGroup: 10001
{{ end }}
                    readOnlyRootFilesystem: {{ and .Values.READONLY_CONTAINER_FILE_SYSTEM_ENABLED (eq .Values.PAAS_PLATFORM "KUBERNETES") }}
                    runAsNonRoot: true
                    seccompProfile:
                        type: RuntimeDefault
                    allowPrivilegeEscalation: false
                    capabilities:
                        drop:
                          - ALL
            topologySpreadConstraints:
{{- if .Values.CLOUD_TOPOLOGIES }}
{{- range $v := .Values.CLOUD_TOPOLOGIES }}
              - topologyKey: {{ $v.topologyKey }}
                maxSkew: {{ $v.maxSkew | default 1 }}
                whenUnsatisfiable: {{ $v.whenUnsatisfiable | default "ScheduleAnyway" }}
                labelSelector:
                  matchLabels:
                    name: "{{ $.Values.INTERNAL_SERVICE }}"
{{- end }}
{{- else }}
              - maxSkew: 1
                topologyKey: "{{ .Values.CLOUD_TOPOLOGY_KEY }}"
                whenUnsatisfiable: ScheduleAnyway
                labelSelector:
                  matchLabels:
                    name: "{{ .Values.INTERNAL_SERVICE }}"
{{- end }}
            terminationGracePeriodSeconds: {{ .Values.GW_TERMINATION_GRACE_PERIOD_S }}
    selector:
        matchLabels:
            name: '{{ .Values.INTERNAL_SERVICE }}'

